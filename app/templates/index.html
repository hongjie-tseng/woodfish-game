<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <title>電子敲木魚</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="topbar__right">
        <span id="team-name" class="team-badge">連線中</span>
        <span id="connection" class="connection connection--pending">連線中</span>
      </div>
    </header>

    <section class="score" aria-label="功德統計">
      <span class="score__label">我的功德</span>
      <strong id="personal-taps">0</strong>
      <span class="score__sub">全隊功德 <b id="team-taps">0</b> ・ 本回合功德 <b id="round-taps">0</b></span>
    </section>

    <button id="tap-area" class="scene-button" type="button" aria-label="敲擊木魚">
      <svg class="scene" viewBox="0 0 360 450" role="img" aria-label="兩位小和尚與木魚">
        <defs>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <ellipse class="ground-shadow" cx="174" cy="409" rx="151" ry="13"/>
        <g id="wooden-fish" class="wooden-fish" filter="url(#soft-shadow)">
          <path class="fish-body" d="M19 362c12-48 38-74 76-74 39 0 60 29 54 62-6 35-45 54-83 48l-31-8-17 8-10-11 11-13z"/>
          <path class="fish-opening" d="M28 384c28-7 54-27 90-48"/>
          <path class="fish-highlight" d="M74 303q28 4 43 18"/>
        </g>
        <g id="monk-left" class="monk-left" filter="url(#soft-shadow)">
          <path class="robe robe-left" d="M113 385c2-37 18-56 44-56 29 0 42 22 45 56l-4 25h-84z"/>
          <path class="robe-fold" d="M143 336c-7 22-4 50 6 72"/>
          <ellipse class="foot" cx="132" cy="406" rx="27" ry="9"/>
          <ellipse class="foot" cx="181" cy="406" rx="27" ry="9"/>
          <ellipse class="head" cx="160" cy="319" rx="34" ry="39"/>
          <path class="ear" d="M128 311c-13-5-13 15-2 19M192 311c13-5 13 15 2 19"/>
          <path class="closed-eye" d="M146 321q5 5 10 0M166 321q5 5 10 0"/>
          <path class="smile" d="M153 337q7 6 14 0"/>
          <g id="small-arm" class="small-arm"><path class="sleeve" d="M144 351c-15 5-24-2-34-16l9-7c11 9 18 10 29 5z"/><path class="arm-skin" d="M116 337l-18-22 6-5 22 20z"/></g>
        </g>
        <g id="monk-right" class="monk-right" filter="url(#soft-shadow)">
          <path class="robe robe-right" d="M203 357c9-52 43-75 87-75 48 0 75 31 82 75l-5 55H207z"/>
          <path class="robe-fold" d="M255 288c-12 39-8 85 10 122M295 288c18 41 21 84 11 121"/>
          <ellipse class="foot" cx="245" cy="410" rx="39" ry="11"/>
          <ellipse class="foot" cx="343" cy="410" rx="42" ry="11"/>
          <ellipse class="head" cx="286" cy="175" rx="65" ry="76"/>
          <path class="ear" d="M223 166c-19-8-20 22-4 29M349 166c19-8 20 22 4 29"/>
          <path class="brow" d="M254 165q10-8 20 0M296 165q10-8 20 0"/>
          <path class="closed-eye" d="M256 180q8 7 16 0M300 180q8 7 16 0"/>
          <path class="nose" d="M286 183v15l-9 4"/>
          <path class="smile" d="M274 215q12 10 24 0"/>
          <g id="arm" class="arm">
            <path class="sleeve" d="M244 257c-22 6-46-5-65-29l18-15c18 16 31 19 47 10z"/>
            <path class="arm-skin" d="M187 228l-51-57 12-10 56 50z"/>
            <g id="mallet" class="mallet">
              <rect class="mallet-handle" x="124" y="157" width="10" height="92" rx="5" transform="rotate(-42 129 203)"/>
              <circle class="mallet-head" cx="104" cy="143" r="20"/>
            </g>
          </g>
        </g>
        <g id="impact-effect" class="impact-effect">
          <path d="M160 180l-8-16M176 178l1-18M191 185l10-14"/>
        </g>
      </svg>
      <span id="merit-layer" class="merit-layer" aria-live="polite"></span>
    </button>

    <footer class="bottom">
      <p id="message" class="message">點一下，讓和尚幫你累積功德</p>
      <div class="bottom__controls">
        <span id="round-label" class="round-label">回合準備中</span>
        <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false">🔊 音效開</button>
      </div>
    </footer>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
