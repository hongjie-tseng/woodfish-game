<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <title>電子敲木魚</title>
  <link rel="stylesheet" href="/static/css/style.css?v=__ASSET_VERSION__">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <label class="sound-picker">
        <span>音色</span>
        <select id="sound-choice" aria-label="木魚音色">
          <option value="small">小木魚</option>
          <option value="medium">中木魚</option>
          <option value="large">大木魚</option>
          <option value="original">原本</option>
        </select>
      </label>
      <div class="topbar__right">
        <span id="team-name" class="team-badge">A 隊</span>
        <span id="connection" class="connection connection--pending">連線中</span>
      </div>
    </header>
    <section class="score" aria-label="功德統計">
      <span class="score__label">我的功德</span>
      <strong id="personal-taps">0</strong>
      <span class="score__sub">
        <span>全隊功德 <b id="team-taps">0</b></span>
      </span>
    </section>
    <button id="tap-area" class="scene-button" type="button" aria-label="敲擊木魚">
      <span class="scene-mount" role="img" aria-label="兩位小和尚與木魚">
        <span class="small-monk">
          <img class="art-layer" src="/static/assets/monk-small.png?v=__ASSET_VERSION__" alt="">
          <img id="wooden-fish" class="art-layer" src="/static/assets/original-wooden-fish.png?v=__ASSET_VERSION__" alt="">
        </span>
        <img class="art-layer monk-arm" src="/static/assets/monk-arm.png?v=__ASSET_VERSION__" alt="">
        <img class="art-layer" src="/static/assets/monk-big.png?v=__ASSET_VERSION__" alt="">
        <img class="art-layer impact-marks" src="/static/assets/impact-marks.png?v=__ASSET_VERSION__" alt="">
      </span>
      <span id="merit-layer" class="merit-layer" aria-live="polite"></span>
    </button>
    <small id="version-info" class="version-info" aria-label="部署版本">vunknown · unknown</small>
    </main>
    <script src="/static/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
