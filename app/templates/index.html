<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <title>電子敲木魚</title>
  <link rel="stylesheet" href="/static/css/style.css?v=__ASSET_VERSION__">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="topbar__right">
        <span id="team-name" class="team-badge">A 隊</span>
        <span id="connection" class="connection connection--pending">已連線</span>
      </div>
    </header>
    <section class="score" aria-label="功德統計">
      <span class="score__label">我的功德</span>
      <strong id="personal-taps">0</strong>
      <span class="score__sub">
        <span>全隊功德 <b id="team-taps">0</b></span>
      </span>
    </section>
    <button id="tap-area" class="scene-button" type="button" aria-label="敲擊木魚">
      <span class="scene-mount" role="img" aria-label="兩位小和尚與木魚">
        <img class="art-layer" src="/static/assets/character-body-no-fish.png?v=__ASSET_VERSION__" alt="">
        <img id="wooden-fish" class="art-layer" src="/static/assets/original-wooden-fish.png?v=__ASSET_VERSION__" alt="">
      </span>
      <span id="merit-layer" class="merit-layer" aria-live="polite"></span>
    </button>
    <footer class="bottom" hidden aria-hidden="true">
      <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-3.75v7.5A4.5 4.5 0 0 0 16.5 12Zm0-8.5v2.05A7 7 0 0 1 16.5 18.45v2.05A9 9 0 0 0 18.5 3.5Z"/></svg>
        <span>音效開</span>
      </button>
    </footer>
    <small id="version-info" class="version-info" aria-label="部署版本">vunknown · unknown</small>
    </main>
    <script src="/static/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
