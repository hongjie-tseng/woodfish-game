<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <title>電子敲木魚</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar"><div class="topbar__right"><span id="team-name" class="team-badge">連線中</span><span id="connection" class="connection connection--pending">連線中</span></div></header>
    <section class="score" aria-label="功德統計">
      <span class="score__label">我的功德</span>
      <strong id="personal-taps">0</strong>
      <span class="score__sub">全隊功德 <b id="team-taps">0</b> ・ 本回合功德 <b id="round-taps">0</b></span>
    </section>
    <button id="tap-area" class="scene-button" type="button" aria-label="敲擊木魚">
      <span id="scene-mount" role="img" aria-label="兩位小和尚與木魚"></span>
      <span id="merit-layer" class="merit-layer" aria-live="polite"></span>
    </button>
    <footer class="bottom"><button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false">🔊 音效開</button></footer>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
